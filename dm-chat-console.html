<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>D&D NPC Sender</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <script>
    // =============================================================================
    // ⚙️ CONFIGURATION - Set your DM password
    // =============================================================================
    // 👉 To set a new password:
    // 1. Open browser console (F12)
    // 2. Run: await crypto.subtle.digest('SHA-256', new TextEncoder().encode('YourPassword')).then(h => console.log(Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('')))
    // 3. Copy the output hash and paste it below
    // Current password hash is for: "dmpass" (change this!)
    const PASSWORD_HASH = "6591d1206a95cdfdf2111559326c14fb97c04e43bc499235238ae2254110d347";
    
    // =============================================================================
    // ⚙️ CHARACTERS - Add/Edit your NPCs here
    // =============================================================================
    const CHARACTERS = [
      { name: "Marlen Dorrick", location: "Dunmar" },
      { name: "Hilda Crane", location: "Dunmar/Bridge" },
      { name: "Luth Varrow", location: "Dunmar/Bridge" },
      { name: "Sargeant Dalen Mire", location: "Dunmar/Bridge" },
      { name: "Captain Taren Vos", location: "Dunmar/Harbor" },
      { name: "Kellan Dorrick", location: "Dunmar/Harbor" },
      { name: "Nessa Lyle", location: "Dunmar/Harbor" },
      { name: "Mira Brant", location: "Dunmar/Mill" },
      { name: "Priestess Alara Tene", location: "Dunmar/Mill" },
      { name: "Ras Fenwick", location: "Dunmar/Mill" },
      { name: "Staplewick", location:"CovenantHall" },
      { name: "Tessera Vale", location:"Dunmar/TheBentCoin" },
      { name: "Jax", location: "Thornwick/Tavern" }
    ];
    // =============================================================================
  </script>
  
  <style>
        :root {
      --bg: #0f1115;
      --panel: #171a21;
      --muted: #9aa3b2;
      --text: #e8ecf1;
      --accent: #6aa6ff;
      --accent-2: #a483ff;
      --border: #232734;
      --hover: #1d2230;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 800px at 20% -10%, #121624 0%, var(--bg) 40%) fixed,
                  linear-gradient(180deg, #0e1118, var(--bg));
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 800px at 20% -10%, #121624 0%, var(--bg) 40%) fixed,
                  linear-gradient(180deg, #0e1118, var(--bg));
      color: var(--text);
    }
    h2 { margin: 0 0 12px; font-weight: 700; letter-spacing: .2px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.03);
    }
    /* Compact character strip */
    .chars {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
      gap: 10px;
      max-height: 128px;
      overflow-y: auto;
      padding: 6px;
      background: #131722;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .char {
      display: grid;
      grid-template-rows: 56px auto;
      place-items: center;
      gap: 6px;
      padding: 8px 6px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: .15s ease;
      user-select: none;
    }
    .char:hover { background: var(--hover); }
    .char.selected {
      border-color: rgba(106,166,255,.7);
      background: linear-gradient(180deg, rgba(106,166,255,.08), rgba(164,131,255,.06));
      box-shadow: 0 0 0 3px rgba(106,166,255,.15);
    }
    .char img {
      width: 56px; height: 56px; object-fit: cover;
      border-radius: 8px; border: 1px solid var(--border);
    }
    .char span {
      width: 100%; text-align: center; font-size: 12px; color: var(--muted);
      line-height: 1.2;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .controls {
      display: grid; gap: 10px;
      grid-template-columns: 1fr 180px;
      margin-top: 12px;
    }
    textarea {
      width: 100%; height: 120px; resize: vertical; min-height: 80px;
      padding: 10px 12px; font-size: 14px; line-height: 1.35;
      background: #0f1420; color: var(--text);
      border: 1px solid var(--border); border-radius: 12px;
      outline: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.02);
    }
    .side {
      display: grid; gap: 10px; grid-template-rows: auto auto;
    }
    .mode {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: #101522; border: 1px solid var(--border); border-radius: 12px; padding: 8px;
    }
    .mode button {
      padding: 8px 10px; font-weight: 600; letter-spacing: .2px;
      border-radius: 10px; border: 1px solid var(--border);
      background: #0f1420; color: var(--text); cursor: pointer;
    }
    .mode button.active {
      border-color: rgba(106,166,255,.7);
      background: linear-gradient(180deg, rgba(106,166,255,.18), rgba(164,131,255,.1));
    }
    .sendbar {
      display: grid; grid-template-columns: 1fr; gap: 8px;
    }
    .send {
      padding: 11px 14px; font-size: 14px; font-weight: 700;
      border: 1px solid rgba(106,166,255,.6);
      background: linear-gradient(180deg, rgba(106,166,255,.22), rgba(164,131,255,.16));
      color: var(--text); border-radius: 12px; cursor: pointer;
      transition: .15s ease;
    }
    .send:hover { filter: brightness(1.08); }
    .hint { color: var(--muted); font-size: 12px; text-align: center; }

    .row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin-top: 10px; }
    input[type="text"] {
      width: 100%; padding: 10px 12px; font-size: 14px;
      background: #0f1420; color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; outline: none;
    }
    label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }
    select {
      width: 100%; padding: 10px 12px; font-size: 14px;
      background: #0f1420; color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; outline: none;
      cursor: pointer;
    }
    select option { background: #0f1420; color: var(--text); }
    
    /* Password overlay */
    #authOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    #authOverlay.hidden { display: none; }
    .auth-box {
      max-width: 400px; width: 100%; margin: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .auth-box h2 { margin: 0 0 8px; text-align: center; }
    .auth-box p { color: var(--muted); font-size: 14px; margin: 0 0 20px; text-align: center; }
    .auth-box input[type="password"] {
      width: 100%; padding: 12px; font-size: 14px;
      background: #0f1420; color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      outline: none; margin-bottom: 12px;
    }
    .auth-box button {
      width: 100%; padding: 12px; font-size: 14px; font-weight: 700;
      border: 1px solid rgba(106,166,255,.6);
      background: linear-gradient(180deg, rgba(106,166,255,.22), rgba(164,131,255,.16));
      color: var(--text); border-radius: 12px; cursor: pointer;
    }
    .auth-box .error {
      color: #ff6b6b; font-size: 13px; margin-top: 8px; text-align: center;
      display: none;
    }
    .auth-box .error.show { display: block; }
  </style>
</head>
<body>
  <!-- Password Authentication Overlay -->
  <div id="authOverlay">
    <div class="auth-box">
      <h2>🔒 DM Access</h2>
      <p>Enter the DM password to continue</p>
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="off" />
      <button id="authBtn">Authenticate</button>
      <div class="error" id="authError">Incorrect password</div>
    </div>
  </div>

  <div class="wrap">
    <h2>D&D NPC Sender</h2>

    <!-- Location filter -->
    <div class="panel" style="padding:10px; margin-bottom: 10px;">
      <label for="locationFilter">Filter by Location</label>
      <select id="locationFilter">
        <option value="">All Locations</option>
      </select>
    </div>

    <!-- Character strip -->
    <div class="panel" style="padding:10px">
      <div class="chars" id="charStrip"></div>
    </div>

    <!-- Message + controls -->
    <div class="controls">
      <div class="panel">
        <label for="msg">Message</label>
        <textarea id="msg" placeholder="Type your line... (Enter to send, Shift+Enter for newline)"></textarea>

        <div class="row">
          <div>
            <label for="title">Override name (optional)</label>
            <input id="title" type="text" placeholder="Use selected NPC by default" />
          </div>
          <div>
            <label for="img">Override image URL (optional)</label>
            <input id="img" type="text" placeholder="Use selected NPC image by default" />
          </div>
        </div>
      </div>

      <div class="side">
        <div class="panel">
          <div class="mode" id="modeBtns">
            <button data-mode="say" class="active">Say</button>
            <button data-mode="do">Do</button>
          </div>
          <p class="hint">“Say” posts as normal; “Do” wraps the text in italics.</p>
        </div>

        <div class="panel sendbar">
          <button class="send" id="sendBtn">Send to Chat</button>
          <div class="hint">Make sure this file is only used by you; the webhook URL is sensitive.</div>
        </div>
      </div>
    </div>

    <!-- DM Chat Section -->
    <div class="panel" style="margin-top: 12px;">
      <h2 style="font-size: 16px; margin-bottom: 10px;">DM Chat</h2>
      <label for="dmMsg">Send as Dungeon Master</label>
      <textarea id="dmMsg" placeholder="Type your DM message... (Enter to send, Shift+Enter for newline)" style="height: 80px;"></textarea>
      <button class="send" id="dmSendBtn" style="margin-top: 10px; width: 100%;">Send as DM</button>
    </div>
  </div>

  <script>
    // =============================================================================
    // 🔐 AUTHENTICATION
    // =============================================================================
    
    // Check if already authenticated
    const authOverlay = document.getElementById('authOverlay');
    const passwordInput = document.getElementById('passwordInput');
    const authBtn = document.getElementById('authBtn');
    const authError = document.getElementById('authError');

    // Helper function to hash password
    async function hashPassword(password) {
      const msgBuffer = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Check authentication on load
    if (localStorage.getItem('dm_authenticated') === 'true') {
      authOverlay.classList.add('hidden');
    }

    // Handle authentication
    async function authenticate() {
      const password = passwordInput.value;
      const hash = await hashPassword(password);
      
      if (hash === PASSWORD_HASH) {
        localStorage.setItem('dm_authenticated', 'true');
        authOverlay.classList.add('hidden');
        authError.classList.remove('show');
        passwordInput.value = '';
      } else {
        authError.classList.add('show');
        passwordInput.value = '';
        passwordInput.focus();
      }
    }

    authBtn.addEventListener('click', authenticate);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        authenticate();
      }
    });

    // Focus password input on load
    if (!localStorage.getItem('dm_authenticated')) {
      passwordInput.focus();
    }

    // =============================================================================
    // ⚙️ CONFIGURATION
    // =============================================================================
    
    // 👉 Replace with your webhook URL:
    const WEBHOOK_URL = "https://chat.googleapis.com/v1/spaces/AAQAfVo6WfA/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=mYYWH0TaePNda9vbK7-oO1E01hQ2pJNtTcXGxMLI-Dk";
    
    // 👉 Replace with your DM webhook URL:
    const DM_WEBHOOK_URL = "https://chat.googleapis.com/v1/spaces/AAQAfVo6WfA/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=FI4jALXITanrASakhVA1BDddskFIISS1mNrCLGIRXwA";
    
    const IMG_BASE_URL = "https://mcgeld.github.io/images/Fatebound/";

    // Characters are defined at the top of the file in the <head> section
    const characters = CHARACTERS;

    // Helper function to generate image path from character name and location
    function getImagePath(character) {
      const nameWithoutSpaces = character.name.replace(/\s+/g, '');
      return `${IMG_BASE_URL}${character.location}/${nameWithoutSpaces}.png`;
    }

    // =============================================================================
    // 🔧 CODE - Don't edit below unless you know what you're doing
    // =============================================================================

    // --- UI wiring ---
    const $ = (q) => document.querySelector(q);
    const strip = $("#charStrip");
    const msgEl = $("#msg");
    const titleEl = $("#title");
    const imgEl = $("#img");
    const modeBtns = $("#modeBtns");
    const sendBtn = $("#sendBtn");
    const locationFilter = $("#locationFilter");
    const dmMsgEl = $("#dmMsg");
    const dmSendBtn = $("#dmSendBtn");



    let currentFilter = "";

    // Build location filter dropdown
    function buildLocationFilter() {
      const locations = new Set();
      characters.forEach(c => {
        if (c.location) {
          // Add full location and all parent paths
          const parts = c.location.split('/');
          let path = '';
          parts.forEach(part => {
            path = path ? `${path}/${part}` : part;
            locations.add(path);
          });
        }
      });
      
      const sorted = Array.from(locations).sort();
      locationFilter.innerHTML = '<option value="">All Locations</option>';
      sorted.forEach(loc => {
        const option = document.createElement('option');
        option.value = loc;
        option.textContent = loc;
        locationFilter.appendChild(option);
      });
    }

    locationFilter.addEventListener('change', (e) => {
      currentFilter = e.target.value;
      renderStrip();
    });

    let selected = null;
    let mode = "say";

    function renderStrip() {
      strip.innerHTML = "";
      const filteredChars = characters.filter(c => {
        if (!currentFilter) return true;
        if (!c.location) return false;
        // Match exact location or any sublocation
        return c.location === currentFilter || c.location.startsWith(currentFilter + '/');
      });

      if (filteredChars.length === 0) {
        strip.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:20px; color:var(--muted);">No characters in this location</div>';
        selected = null;
        return;
      }

      filteredChars.forEach((c, i) => {
        const div = document.createElement("div");
        div.className = "char";
        div.innerHTML = `<img src="${getImagePath(c)}" alt=""><span>${c.name}</span>`;
        div.onclick = () => selectChar(characters.indexOf(c), div);
        strip.appendChild(div);
        if (i === 0) selectChar(characters.indexOf(c), div); // default select first
      });
    }

    function selectChar(i, el) {
      document.querySelectorAll(".char").forEach(n => n.classList.remove("selected"));
      el.classList.add("selected");
      selected = characters[i];
    }

    modeBtns.addEventListener("click", (e) => {
      if (e.target.tagName !== "BUTTON") return;
      mode = e.target.dataset.mode;
      [...modeBtns.children].forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      msgEl.focus();
    });

    // Send on Enter (Shift+Enter = newline)
    msgEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    sendBtn.addEventListener("click", send);

    async function send() {
      if (!selected) { alert("Pick a character."); return; }
      const textRaw = msgEl.value.trim();
      if (!textRaw) { alert("Type a message."); return; }    
      // Apply simple formatting: "Do" = italicized action
      const text = mode === "do" ? `<i>${textRaw}</i>` : textRaw;

      // Allow temporary overrides
      const name = (titleEl.value.trim() || selected.name);
      const image = (imgEl.value.trim() || getImagePath(selected));

      // Build a clean, compact card (Cards v2)
      const card = {
        cardsV2: [{
          card: {
            header: {
              title: name,
              imageUrl: image
            },
            sections: [
              {
                widgets: [
                  { textParagraph: { text } }
                ]
              }
            ]
          }
        }]
      };

      try {
        await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(card)
        });
        msgEl.value = "";
        msgEl.focus();
      } catch (err) {
        alert("Failed to send. Check console for details.");
        console.error(err);
      }
    }

    // DM Chat functionality
    dmMsgEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendDM();
      }
    });
    dmSendBtn.addEventListener("click", sendDM);

    async function sendDM() {
      const textRaw = dmMsgEl.value.trim();
      if (!textRaw) { alert("Type a DM message."); return; }

      // Simple text message for DM
      const message = {
        text: textRaw
      };

      try {
        await fetch(DM_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(message)
        });
        dmMsgEl.value = "";
        dmMsgEl.focus();
      } catch (err) {
        alert("Failed to send DM message. Check console for details.");
        console.error(err);
      }
    }

    buildLocationFilter();
    renderStrip();
  </script>
</body>
</html>
